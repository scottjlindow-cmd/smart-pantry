<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PantryOS - Visual Food Inventory</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 antialiased selection:bg-emerald-500 selection:text-slate-950">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <header class="flex justify-between items-center mb-6 pt-2">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-emerald-400">PantryOS</h1>
        <p class="text-xs text-slate-400 font-medium">Visual Inventory & Restock</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="open-settings-btn" title="API Settings" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl border border-slate-700 transition">
          <i data-lucide="key" class="w-4 h-4"></i>
        </button>
        <button id="open-modal-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-2 rounded-xl text-sm flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 active:scale-95 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Item
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="grid grid-cols-2 bg-slate-800/90 p-1 rounded-xl mb-4 text-sm font-semibold border border-slate-700/50">
      <button id="tab-inventory" class="py-2 rounded-lg bg-slate-700 text-white shadow-sm transition">Inventory</button>
      <button id="tab-shopping" class="py-2 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
        Shopping List
        <span id="shopping-badge" class="hidden bg-emerald-500 text-slate-950 text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>
    </nav>

    <!-- Inventory View -->
    <section id="view-inventory">
      <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none text-xs font-semibold">
        <button class="filter-chip px-3.5 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition" data-loc="all">All</button>
        <button class="filter-chip px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-600 transition" data-loc="Pantry">Pantry</button>
        <button class="filter-chip px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-600 transition" data-loc="Fridge">Fridge</button>
        <button class="filter-chip px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-600 transition" data-loc="Freezer">Freezer</button>
      </div>

      <div id="inventory-list" class="space-y-3"></div>
      <div id="inventory-empty" class="hidden text-center py-12 text-slate-500 text-sm">No items found. Tap "+ Add Item" or snap a photo.</div>
    </section>

    <!-- Shopping List View -->
    <section id="view-shopping" class="hidden">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Restock Needed</span>
        <button id="clear-bought-btn" class="text-xs text-emerald-400 hover:underline">Restock All Items</button>
      </div>
      <div id="shopping-list" class="space-y-2"></div>
      <div id="shopping-empty" class="hidden text-center py-12 text-slate-500 text-sm">Everything is fully stocked!</div>
    </section>
  </div>

  <!-- Add Item Modal -->
  <dialog id="item-modal" class="bg-slate-800 text-slate-100 p-6 rounded-2xl max-w-sm w-11/12 border border-slate-700 shadow-2xl backdrop:bg-slate-950/80">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold">Add Item</h3>
      <button id="close-modal-btn" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <!-- AI Visual Identification Button -->
    <div class="mb-4 bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60 text-center">
      <div id="photo-preview-box" class="hidden mb-3 relative rounded-lg overflow-hidden border border-slate-700 max-h-36">
        <img id="item-preview-img" src="" class="w-full h-full object-cover" />
      </div>
      <label class="cursor-pointer w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95 transition">
        <i data-lucide="camera" class="w-4 h-4"></i> Snap Item Photo
        <input type="file" id="visual-ai-input" accept="image/*" capture="environment" class="hidden" />
      </label>
      <p id="ai-status" class="text-[11px] font-medium text-slate-400 mt-2">Take a photo of any food box, jar, or produce.</p>
    </div>

    <form id="item-form" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Item Name</label>
        <input required type="text" id="input-name" placeholder="e.g. Cheerios" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Storage</label>
          <select id="input-location" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="Pantry">Pantry</option>
            <option value="Fridge">Fridge</option>
            <option value="Freezer">Freezer</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Quantity</label>
          <input type="number" id="input-qty" min="1" value="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Stock Level</label>
        <select id="input-status" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="full">Full (100%)</option>
          <option value="three_quarters">3/4 Full (75%)</option>
          <option value="half">1/2 Full (50%)</option>
          <option value="less_half">Less than Half (25%)</option>
          <option value="out">Out of Stock (0%)</option>
        </select>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="input-staple" checked class="rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0" />
        <label for="input-staple" class="text-xs text-slate-300">Always keep in rotation (Staple)</label>
      </div>

      <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-sm transition mt-2">Save to Inventory</button>
    </form>
  </dialog>

  <!-- Photo Viewer Modal -->
  <dialog id="viewer-modal" class="bg-slate-900 text-slate-100 p-4 rounded-2xl max-w-sm w-11/12 border border-slate-700 shadow-2xl backdrop:bg-slate-950/85">
    <div class="flex justify-between items-center mb-3">
      <h3 id="viewer-title" class="text-base font-bold truncate"></h3>
      <button id="close-viewer-btn" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
      <img id="viewer-image" class="w-full h-auto max-h-[60vh] object-contain mx-auto" />
    </div>
  </dialog>

  <!-- API Key Setup Modal -->
  <dialog id="settings-modal" class="bg-slate-800 text-slate-100 p-6 rounded-2xl max-w-sm w-11/12 border border-slate-700 shadow-2xl backdrop:bg-slate-950/80">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-lg font-bold">Gemini API Key</h3>
      <button id="close-settings-btn" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p class="text-xs text-slate-400 mb-3">Add a free key from <a href="https://aistudio.google.com/" target="_blank" class="text-emerald-400 underline">Google AI Studio</a> to enable instant photo recognition.</p>
    <input type="password" id="api-key-input" placeholder="Paste AI Studio API Key..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 mb-3" />
    <button id="save-key-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-xl text-sm transition">Save API Key</button>
  </dialog>

  <script>
    const STATUS_CONFIG = {
      full: { label: 'Full', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30', next: 'three_quarters', needsBuy: false },
      three_quarters: { label: '3/4 Full', color: 'bg-teal-500/10 text-teal-400 border-teal-500/30', next: 'half', needsBuy: false },
      half: { label: '1/2 Full', color: 'bg-amber-500/10 text-amber-400 border-amber-500/30', next: 'less_half', needsBuy: true },
      less_half: { label: '< Half', color: 'bg-orange-500/10 text-orange-400 border-orange-500/30', next: 'out', needsBuy: true },
      out: { label: 'Out', color: 'bg-rose-500/10 text-rose-400 border-rose-500/30', next: 'full', needsBuy: true }
    };

    let items = JSON.parse(localStorage.getItem('pantry_items_v2')) || [
      { id: '1', name: 'Olive Oil', location: 'Pantry', status: 'full', quantity: 1, photo: null, staple: true },
      { id: '2', name: 'Eggs (Dozen)', location: 'Fridge', status: 'half', quantity: 2, photo: null, staple: true },
      { id: '3', name: 'Ground Turkey', location: 'Freezer', status: 'out', quantity: 1, photo: null, staple: true }
    ];

    let currentCapturedPhoto = null;
    let currentTab = 'inventory';
    let activeFilter = 'all';

    const save = () => {
      localStorage.setItem('pantry_items_v2', JSON.stringify(items));
      render();
    };

    const cycleStatus = (id) => {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.status = STATUS_CONFIG[item.status]?.next || 'full';
      save();
    };

    const updateQty = (id, delta) => {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.quantity = Math.max(1, (item.quantity || 1) + delta);
      save();
    };

    const deleteItem = (id) => {
      items = items.filter(i => i.id !== id);
      save();
    };

    const viewPhoto = (id) => {
      const item = items.find(i => i.id === id);
      if (!item || !item.photo) return;
      document.getElementById('viewer-title').textContent = item.name;
      document.getElementById('viewer-image').src = item.photo;
      document.getElementById('viewer-modal').showModal();
    };

    const render = () => {
      const buyCount = items.filter(i => STATUS_CONFIG[i.status]?.needsBuy).length;
      const badge = document.getElementById('shopping-badge');
      if (buyCount > 0) {
        badge.textContent = buyCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      // Inventory List
      const invContainer = document.getElementById('inventory-list');
      const filtered = items.filter(i => activeFilter === 'all' || i.location === activeFilter);
      
      document.getElementById('inventory-empty').classList.toggle('hidden', filtered.length > 0);
      invContainer.innerHTML = filtered.map(item => {
        const conf = STATUS_CONFIG[item.status] || STATUS_CONFIG.full;
        const photoThumb = item.photo 
          ? `<img src="${item.photo}" onclick="viewPhoto('${item.id}')" class="w-12 h-12 object-cover rounded-lg border border-slate-700 cursor-pointer active:scale-95 transition" />`
          : `<div class="w-12 h-12 rounded-lg bg-slate-900 border border-slate-700/60 flex items-center justify-center text-slate-600"><i data-lucide="package" class="w-6 h-6"></i></div>`;

        return `
          <div class="p-3 bg-slate-800/80 border border-slate-700/50 rounded-xl hover:border-slate-600 transition space-y-2.5">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                ${photoThumb}
                <div class="truncate cursor-pointer" onclick="${item.photo ? `viewPhoto('${item.id}')` : ''}">
                  <h4 class="font-bold text-sm text-slate-100 truncate">${item.name}</h4>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-xs text-slate-400 font-medium">${item.location}</span>
                    <span class="text-slate-600">•</span>
                    <span class="text-xs text-slate-400">Qty: ${item.quantity || 1}</span>
                  </div>
                </div>
              </div>
              <button onclick="cycleStatus('${item.id}')" class="text-xs px-2.5 py-1.5 rounded-lg font-bold border transition whitespace-nowrap ${conf.color}">
                ${conf.label}
              </button>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-700/40 text-xs text-slate-400">
              <div class="flex items-center gap-1.5">
                <span>Quantity:</span>
                <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-slate-900 border border-slate-700 rounded flex items-center justify-center text-slate-300 hover:bg-slate-700 font-bold">-</button>
                <span class="px-1.5 font-bold text-white">${item.quantity || 1}</span>
                <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-slate-900 border border-slate-700 rounded flex items-center justify-center text-slate-300 hover:bg-slate-700 font-bold">+</button>
              </div>
              <button onclick="deleteItem('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1 flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete</button>
            </div>
          </div>
        `;
      }).join('');

      // Shopping List
      const shopContainer = document.getElementById('shopping-list');
      const shopItems = items.filter(i => STATUS_CONFIG[i.status]?.needsBuy);
      document.getElementById('shopping-empty').classList.toggle('hidden', shopItems.length > 0);
      
      shopContainer.innerHTML = shopItems.map(item => {
        const conf = STATUS_CONFIG[item.status] || STATUS_CONFIG.out;
        return `
          <div class="flex items-center justify-between p-3.5 bg-slate-800/80 border border-slate-700/50 rounded-xl">
            <div>
              <h4 class="font-bold text-sm text-slate-100">${item.name}</h4>
              <div class="flex items-center gap-2 mt-0.5 text-xs">
                <span class="${item.status === 'out' ? 'text-rose-400 font-semibold' : 'text-amber-400'}">${conf.label}</span>
                <span class="text-slate-500">•</span>
                <span class="text-slate-400">Need: ${item.quantity || 1}</span>
              </div>
            </div>
            <button onclick="cycleStatus('${item.id}')" class="bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg border border-emerald-500/40 transition">
              Mark Full
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    };

    // Navigation Tabs
    const tabInv = document.getElementById('tab-inventory');
    const tabShop = document.getElementById('tab-shopping');
    const viewInv = document.getElementById('view-inventory');
    const viewShop = document.getElementById('view-shopping');

    tabInv.onclick = () => {
      viewInv.classList.remove('hidden');
      viewShop.classList.add('hidden');
      tabInv.className = 'py-2 rounded-lg bg-slate-700 text-white shadow-sm transition';
      tabShop.className = 'py-2 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5';
    };

    tabShop.onclick = () => {
      viewShop.classList.remove('hidden');
      viewInv.classList.add('hidden');
      tabShop.className = 'py-2 rounded-lg bg-slate-700 text-white shadow-sm transition flex items-center justify-center gap-1.5';
      tabInv.className = 'py-2 rounded-lg text-slate-400 hover:text-white transition';
    };

    // Filter Chips
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-chip').forEach(b => {
          b.className = 'filter-chip px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-600 transition';
        });
        btn.className = 'filter-chip px-3.5 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition';
        activeFilter = btn.dataset.loc;
        render();
      };
    });

    // Image Compression Helper
    const processImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600; // Efficient size for rapid local storage & API
            let scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve({
              dataUrl,
              base64: dataUrl.split(',')[1]
            });
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    // AI Visual Identification
    document.getElementById('visual-ai-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      const statusEl = document.getElementById('ai-status');

      if (!apiKey) {
        document.getElementById('settings-modal').showModal();
        statusEl.textContent = 'Please enter your Gemini API key in settings (top key icon).';
        statusEl.className = 'text-[11px] font-medium text-rose-400 mt-2';
        return;
      }

      statusEl.textContent = 'Analyzing photo with Gemini AI...';
      statusEl.className = 'text-[11px] font-medium text-amber-400 mt-2';

      try {
        const { dataUrl, base64 } = await processImage(file);
        currentCapturedPhoto = dataUrl;

        // Show thumbnail preview in form
        document.getElementById('item-preview-img').src = dataUrl;
        document.getElementById('photo-preview-box').classList.remove('hidden');

        const promptText = 'Identify this food item or grocery product. Respond ONLY with raw valid JSON: {"name": "Product Name", "location": "Pantry" | "Fridge" | "Freezer"}';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: 'image/jpeg', data: base64 } }
              ]
            }]
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData?.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('Empty AI response');

        const cleanJsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleanJsonStr);

        if (parsed.name) {
          document.getElementById('input-name').value = parsed.name;
        }
        if (['Pantry', 'Fridge', 'Freezer'].includes(parsed.location)) {
          document.getElementById('input-location').value = parsed.location;
        }

        statusEl.textContent = `Identified: "${parsed.name || 'Item'}" (${parsed.location || 'Pantry'})`;
        statusEl.className = 'text-[11px] font-medium text-emerald-400 mt-2';
        if (navigator.vibrate) navigator.vibrate(100);
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Error: ${err.message || 'Check API key or image'}`;
        statusEl.className = 'text-[11px] font-medium text-rose-400 mt-2';
      }
    };

    // Modal Controls
    const modal = document.getElementById('item-modal');
    document.getElementById('open-modal-btn').onclick = () => {
      currentCapturedPhoto = null;
      document.getElementById('photo-preview-box').classList.add('hidden');
      document.getElementById('ai-status').textContent = 'Take a photo of any food box, jar, or produce.';
      document.getElementById('ai-status').className = 'text-[11px] font-medium text-slate-400 mt-2';
      document.getElementById('item-form').reset();
      document.getElementById('input-qty').value = 1;
      document.getElementById('input-status').value = 'full';
      modal.showModal();
    };
    document.getElementById('close-modal-btn').onclick = () => modal.close();

    // Photo Viewer Controls
    document.getElementById('close-viewer-btn').onclick = () => document.getElementById('viewer-modal').close();

    // Settings Modal Controls
    const settingsModal = document.getElementById('settings-modal');
    document.getElementById('open-settings-btn').onclick = () => {
      document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
      settingsModal.showModal();
    };
    document.getElementById('close-settings-btn').onclick = () => settingsModal.close();
    document.getElementById('save-key-btn').onclick = () => {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      settingsModal.close();
      alert('API Key saved successfully!');
    };

    // Form Submission
    document.getElementById('item-form').onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('input-name').value.trim();
      const location = document.getElementById('input-location').value;
      const status = document.getElementById('input-status').value;
      const quantity = parseInt(document.getElementById('input-qty').value, 10) || 1;
      const staple = document.getElementById('input-staple').checked;

      items.push({
        id: crypto.randomUUID(),
        name,
        location,
        status,
        quantity,
        photo: currentCapturedPhoto,
        staple
      });

      save();
      e.target.reset();
      currentCapturedPhoto = null;
      modal.close();
    };

    // Restock all action
    document.getElementById('clear-bought-btn').onclick = () => {
      items.forEach(i => i.status = 'full');
      save();
    };

    render();
  </script>
</body>
</html>
